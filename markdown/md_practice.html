<h1>markdown</h1>

<script>
var Markdown= new XMLHttpRequest();

Markdown.open("GET", 'https://raw.githubusercontent.com/toutatsu/git_practice/main/README.md', false);
Markdown.send(null);
div = document.createElement("div")
div.innerHTML = marked(Markdown.responseText)
document.body.appendChild(div)
