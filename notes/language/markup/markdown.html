<!DOCTYPE html>
<!--Document Type Definition HTML 5であることを明記-->

<html lang="ja">

<head>
    <!--タイトル--><title>markdown</title>
    <script src="/template/template.js"></script>
</head>
<body>
    

    <main>
        <article>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/0.3.2/marked.min.js"></script>
            <script>
                var Markdown= new XMLHttpRequest();

                Markdown.open("GET", 'https://raw.githubusercontent.com/toutatsu/git_practice/main/MARKDOWN.md', false);
                Markdown.send(null);
                document.body.getElementsByTagName('article')[0].insertAdjacentHTML('beforeEnd',marked(Markdown.responseText)+'<br><br>')
            </script>
        </article>
    </main>
</body>
